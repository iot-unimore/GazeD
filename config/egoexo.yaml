title: "egoexo"
kind: "egoexo"
azureroot: ""
batch_output: true
vis_freq: 1000
vis_n_elements: 10

model:
  name: "vol"
  kind: "mpii"
  
  image_shape: [192, 256]
  heatmap_shape: [72, 96]
  heatmap_softmax: true
  heatmap_multiplier: 100.0

  init_weights: false
  checkpoint: ""

  backbone:
    name: "resnet152"
    style: "simple"

    num_final_layer_channel: 20
    num_joints: 20
    num_layers: 152
    
    init_weights: true
    fix_weights: true
    checkpoint: "ContextPose/data/pretrained/coco/pose_hrnet_w32_256x192.pth"
    
  volume_net:
    volume_aggregation_method: "softmax"
    use_gt_pelvis: false

    cuboid_size: 2500.0
    volume_size: 64
    volume_multiplier: 1.0
    volume_softmax: true

    use_feature_v2v: true

    temperature: 1500

  poseformer:
    embed_dim_ratio: 128
    depth: 4
    mask_pose: false

dataset:
  kind: "EgoExo"
  data_format: ""
  root: "/path_to_webdataset/EgoExo/"
  train_shards: 'data-{000000..000015}.tar'
  val_shards: 'data-{000000..000002}.tar'
  test_shards: 'data-{000000..000004}.tar'


gaze:
  num_joints: 19
  leye: 1
  reye: 2
  root_joint: -2

train:
  n_objects_per_epoch: 15000
  n_epochs: 9999

  batch_size: 128

  optimizer: 'Adam'
  backbone_lr: 0.0001
  backbone_lr_step: [1000]
  backbone_lr_factor: 0.1
  process_features_lr: 0.001
  volume_net_lr: 0.0064
  volume_net_lr_decay: 0.99
  volume_net_lr_step: [1000]
  volume_net_lr_factor: 0.5

  with_damaged_actions: true
  undistort_images: true

  scale_bbox: 1.0

  shuffle: true
  randomize_n_views: true
  min_n_views: 1
  max_n_views: 1
  num_workers: 8

  limb_length_path: "data/human36m/extra/mean_and_std_limb_length.h5"
  pred_results_path: "data/pretrained/human36m/human36m_alg_10-04-2019/checkpoints/0060/results/train.pkl"

val:
  batch_size: 128

  scale_bbox: 1.0

  shuffle: false

  min_n_views: 1
  max_n_views: 1
  num_workers: 6
  
